name: Sync Skills to SkillHub

on:
  push:
    branches:
      - main
      - master
    paths:
      - "skills/miliastra-image-css-builder/**"
      - "skills/miliastra-image-svg-builder/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-skillhub:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - skill_dir: skills/miliastra-image-css-builder
          - skill_dir: skills/miliastra-image-svg-builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check if this skill changed (push only)
        id: changed
        if: github.event_name == 'push'
        run: |
          if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- "${{ matrix.skill_dir }}" | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SkillHub CLI
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changed.outputs.changed == 'true'
        run: |
          curl -fsSL https://skillhub.cn/install/install.sh | bash -s -- --cli-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Login to SkillHub
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changed.outputs.changed == 'true'
        env:
          SKILLHUB_HOST: ${{ vars.SKILLHUB_REGISTRY != '' && vars.SKILLHUB_REGISTRY || secrets.SKILLHUB_REGISTRY != '' && secrets.SKILLHUB_REGISTRY || 'https://api.skillhub.cn' }}
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
        run: |
          if [ -z "${SKILLHUB_TOKEN}" ]; then
            echo "::error title=Missing Secret::Please set SKILLHUB_TOKEN in repository secrets."
            exit 1
          fi
          skillhub login \
            --key "${SKILLHUB_TOKEN}" \
            --host "${SKILLHUB_HOST}"
          skillhub auth whoami

      - name: Publish to SkillHub
        if: |
          github.event_name == 'workflow_dispatch' ||
          steps.changed.outputs.changed == 'true'
        run: |
          skillhub publish "${{ matrix.skill_dir }}" \
            --changelog "Sync from GitHub commit ${GITHUB_SHA}"
